# One environment (Web + API + PostgreSQL) on this machine. Use ./deploy/local/up.ps1 (README).
#   $env:DOCKER_CONTEXT='desktop-linux'
#   docker compose -f deploy/local/docker-compose.yml up --build -d
# Host ports: EE_WEB_PORT (5080), EE_API_PORT (5081), EE_DB_PORT (5432).
# Start order (stage 1): postgres (healthy) → migrate → seed → api → web. migrate and seed are one-off steps from the
# `migrator` image; the apps never migrate or seed on startup and do not start if a step fails.
name: ephemeral-envs-local

# GSS Encryption Mode=Disable: no Kerberos here; otherwise Npgsql probes libgssapi_krb5.so.2 (absent in the .NET
# Ubuntu images) and logs "Cannot load library" on every new connection pool.
x-db-connection: &db-connection Host=postgres;Database=ephemeral_envs;Username=ephemeral_envs;Password=ephemeral_envs;GSS Encryption Mode=Disable

x-migrator: &migrator
  build:
    context: ../..
    dockerfile: src/EphemeralEnvs.DbTool/Dockerfile
  image: ephemeral-envs-local/migrator
  restart: "no"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ephemeral_envs
      POSTGRES_USER: ephemeral_envs
      POSTGRES_PASSWORD: ephemeral_envs
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${EE_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ephemeral_envs -d ephemeral_envs"]
      interval: 5s
      timeout: 3s
      retries: 10

  # EF Core migration bundle; prints "No migrations were applied" when the schema is current.
  migrate:
    <<: *migrator
    command: ["./efbundle", "--connection", *db-connection]
    depends_on:
      postgres:
        condition: service_healthy

  # Demo data, once per database (journal __db_tool_history). db-update.ps1 -Restore brings deleted demo rows back.
  seed:
    <<: *migrator
    command: ["dotnet", "EphemeralEnvs.DbTool.dll", "seed"]
    environment:
      ConnectionStrings__Default: *db-connection
      App__EnvironmentName: local
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ../..
      dockerfile: src/EphemeralEnvs.Api/Dockerfile
    ports:
      - "${EE_API_PORT:-5081}:8080"
    environment:
      ConnectionStrings__Default: *db-connection
      # The browser's origin is the Web as seen from the host.
      Cors__AllowedOrigins: http://localhost:${EE_WEB_PORT:-5080}
      Swagger__Enabled: "true"
      App__EnvironmentName: local
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: src/EphemeralEnvs.Web/Dockerfile
    ports:
      - "${EE_WEB_PORT:-5080}:8080"
    environment:
      # Server-side calls stay inside the compose network; the browser uses the host port.
      Api__InternalBaseUrl: http://api:8080
      Api__PublicBaseUrl: http://localhost:${EE_API_PORT:-5081}
      Api__TimeoutSeconds: "5"
      App__EnvironmentName: local
    depends_on:
      - api

volumes:
  pgdata:
